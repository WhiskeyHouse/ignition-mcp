[project]
name = "ignition-mcp"
version = "1.1.0"
description = "Local HTTP MCP front for `ign mcp serve` with composite workflows, resources, and prompts"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4",
    "pydantic-settings>=2",
]

[project.scripts]
ign-mcp = "ignition_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignition_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
